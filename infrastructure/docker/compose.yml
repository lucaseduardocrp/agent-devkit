name: adk
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adk
      POSTGRES_DB: adk
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adk -d adk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - database-data:/var/lib/postgresql/data

  migration:
    build:
      context: ../../apps/Backend
      target: migration
    environment:
      NODE_ENV: production
    secrets:
      - database_password
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="$$(node -e 'const fs = require("node:fs"); const url = new URL("postgresql://adk@database:5432/adk"); url.password = fs.readFileSync("/run/secrets/database_password", "utf8").replace(/\n+$$/, ""); process.stdout.write(url.toString())')"
        exec npm run prisma:migrate:deploy

  api:
    build:
      context: ../../apps/Backend
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PROVIDER: postgres
    secrets:
      - database_password
      - integration_encryption_key
    ports:
      - "3000:3000"
    depends_on:
      migration:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="$$(node -e 'const fs = require("node:fs"); const url = new URL("postgresql://adk@database:5432/adk"); url.password = fs.readFileSync("/run/secrets/database_password", "utf8").replace(/\n+$$/, ""); process.stdout.write(url.toString())')"
        export INTEGRATION_ENCRYPTION_KEY="$$(tr -d '\r\n' < /run/secrets/integration_encryption_key)"
        exec node dist/src/bootstrap/server.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

secrets:
  database_password:
    file: ./secrets/database_password.txt
  integration_encryption_key:
    file: ./secrets/integration_encryption_key.txt

volumes:
  database-data:
