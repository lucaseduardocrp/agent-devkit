name: MCP CI

on:
  pull_request:
    paths:
      - 'apps/Mcp/**'
      # The parity guard reads the backend route declarations.
      - 'apps/Backend/src/adapters/http/**'
      - '.github/workflows/mcp-*.yml'
  push:
    branches: [main]
    paths:
      - 'apps/Mcp/**'
      - 'apps/Backend/src/adapters/http/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/Mcp/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
