name: CLI CI

on:
  pull_request:
    paths:
      - 'apps/Cli/**'
      # The CLI embeds the MCP server built from apps/Mcp.
      - 'apps/Mcp/**'
      # The parity test compares the vendored runner with the backend's E2E module.
      - 'apps/Backend/src/modules/e2e/**'
      - '.github/workflows/cli-*.yml'
  push:
    branches: [main]
    paths:
      - 'apps/Cli/**'
      - 'apps/Mcp/**'
      - 'apps/Backend/src/modules/e2e/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/Mcp/package-lock.json
            apps/Cli/package-lock.json
      # Tests and typecheck read the MCP sources; the build compiles and embeds apps/Mcp.
      - run: npm ci
        working-directory: apps/Mcp
      - run: npm ci
      - run: npm run verify
      - run: npm run build
