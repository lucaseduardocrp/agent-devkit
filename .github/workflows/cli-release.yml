name: CLI release

# Publishes the `devkit` command line to the public npm registry when a tag such as `cli-v0.5.0`
# is pushed, so anyone installs it with `npm install -g @agent-devkit/cli`. The package embeds the
# MCP server built from apps/Mcp (scripts/embed-mcp.mjs); the server itself is not published, it is
# deployed to Railway from its Dockerfile.
# Authenticates with npm Trusted Publishing (OIDC, no secret) once it is configured for the
# @agent-devkit/cli package on npmjs.com; until then the repository secret NPM_AGENT_DEVKIT is used.
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_AGENT_DEVKIT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Read the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_ENV"
      # Without Trusted Publishing configured, the NPM_AGENT_DEVKIT repository secret must be set.
      - name: Check npm credentials
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::The NPM_AGENT_DEVKIT secret is empty or missing; publishing relies on npm Trusted Publishing."
          else
            npm whoami || { echo "::error::NPM_AGENT_DEVKIT is invalid or expired. Create a new npm token and update the NPM_AGENT_DEVKIT repository secret."; exit 1; }
          fi

      - name: Verify the MCP server
        working-directory: apps/Mcp
        run: |
          npm ci
          npm run verify
      # The build compiles apps/Mcp and embeds it into the package.
      - name: Verify and build the CLI
        working-directory: apps/Cli
        run: |
          npm ci
          npm run verify
          npm run build

      - name: Publish @agent-devkit/cli
        working-directory: apps/Cli
        run: |
          npm pkg set version="$VERSION"
          npm pkg delete private
          npm publish --access public
          npm pack

      - name: Attach the tarball to a GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" apps/Cli/*.tgz --title "ADK CLI $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
