name: npm release

# Publishes @agent-devkit/mcp and @agent-devkit/cli to the public npm registry, with the same
# version, when a tag such as `cli-v0.5.0` is pushed. Anyone then installs the command line with
# `npm install -g @agent-devkit/cli`; it depends on the exact @agent-devkit/mcp of the same release.
# Authenticates with npm Trusted Publishing (OIDC, no secret) once it is configured on npmjs.com for
# both packages with this workflow file; until then the repository secret NPM_AGENT_DEVKIT is used.
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_AGENT_DEVKIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Read the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_ENV"
      # Without Trusted Publishing configured, the NPM_AGENT_DEVKIT repository secret must be set.
      - name: Check npm credentials
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::The NPM_AGENT_DEVKIT secret is empty or missing; publishing relies on npm Trusted Publishing."
          else
            npm whoami || { echo "::error::NPM_AGENT_DEVKIT is invalid or expired. Create a new npm token and update the NPM_AGENT_DEVKIT repository secret."; exit 1; }
          fi

      - name: Verify and build the MCP server
        working-directory: apps/Mcp
        run: |
          npm ci
          npm run verify
          npm run build
      - name: Verify and build the CLI
        working-directory: apps/Cli
        run: |
          npm ci
          npm run verify
          npm run build

      # The MCP package goes first: the published CLI depends on this exact version.
      - name: Publish @agent-devkit/mcp
        working-directory: apps/Mcp
        run: |
          npm pkg set version="$VERSION"
          npm pkg delete private
          npm publish --access public
          npm pack
      - name: Publish @agent-devkit/cli
        working-directory: apps/Cli
        run: |
          npm pkg set version="$VERSION" "dependencies.@agent-devkit/mcp=$VERSION"
          npm pkg delete private
          npm publish --access public
          npm pack

      - name: Attach the tarballs to a GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" apps/Mcp/*.tgz apps/Cli/*.tgz --title "ADK CLI $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
