name: Desktop

# Verifies the desktop app (apps/Desktop) on every pull request that touches it and, when a tag such
# as `desktop-v0.1.0` is pushed, builds the installers for Windows, macOS and Linux and attaches
# them to a GitHub release. The installers are not code signed yet: Windows SmartScreen and macOS
# Gatekeeper warn on the first launch until signing certificates are configured.
on:
  pull_request:
    paths:
      - 'apps/Desktop/**'
      - '.github/workflows/desktop-release.yml'
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify

  installers:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/Desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Set the version from the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version
      # `dist` stages the web app, API and MCP server, compiles the app and runs electron-builder.
      - run: npm run dist -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/Desktop/release/*.exe
            apps/Desktop/release/*.dmg
            apps/Desktop/release/*.zip
            apps/Desktop/release/*.AppImage
            apps/Desktop/release/*.deb
            apps/Desktop/release/latest*.yml
            apps/Desktop/release/*.blockmap
