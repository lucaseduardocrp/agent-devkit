name: OpenSSF Scorecard

# Grades the repository against the OpenSSF supply-chain security checks (branch protection,
# pinned dependencies, token permissions...) and publishes the result for the README badge.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    # Forks and mirrors do not publish results.
    if: github.repository == 'lucaseduardocrp/agent-devkit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
