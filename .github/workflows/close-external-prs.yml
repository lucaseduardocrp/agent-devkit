name: Close external pull requests

# The project does not accept contributions (see CONTRIBUTING.md). Pull requests opened by anyone
# other than the repository owner or a bot (e.g. Dependabot) are closed with an explanation.
# pull_request_target runs with the base repository's token but never checks out the PR's code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: >-
      github.event.pull_request.user.login != github.repository_owner &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --comment "Thanks for your interest. This project does not accept pull requests: it is developed by its author only. You are free to fork it under the terms of the license, and bug reports are welcome as issues. See CONTRIBUTING.md.

          Skills and plugins for the ADK Hub are welcome as pull requests in https://github.com/lucaseduardocrp/agent-devkit-hub."
