version: 2

# Weekly dependency updates. Minor and patch versions are grouped into one pull request per
# ecosystem; major versions come one by one. Like any pull request, they need CI to pass and the
# owner's review to merge.
updates:
  - package-ecosystem: npm
    directories:
      - /apps/Backend
      - /apps/Frontend
      - /apps/Mcp
      - /apps/Cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The CLI embeds the MCP server and must declare its runtime dependencies with the same
      # ranges (tests/embedded-mcp.test.ts), so each of them is updated in both in one PR.
      embedded-mcp:
        group-by: dependency-name
        patterns:
          - '@modelcontextprotocol/sdk'
          - express
          - express-rate-limit
          - zod
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/Backend
      - /apps/Frontend
      - /apps/Mcp
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ['*']
